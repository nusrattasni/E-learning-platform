version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-app
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=lms_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: 'lms_db'
      MYSQL_ROOT_PASSWORD: 'secret'
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  lms-network:
    driver: bridge

volumes:
  db-data:
